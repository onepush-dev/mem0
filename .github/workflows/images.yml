name: Build images

# Builds the Railway images from api/ and dashboard/ (upstream mem0 v2.2.1, pinned + checksum-verified)
# and publishes them to GHCR. The Railway template deploys these images by digest.
on:
  push:
    branches: [main]
    paths: ["api/**", "dashboard/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MEM0_VERSION: v2.2.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mem0-api
            context: api
          - name: mem0-dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.MEM0_VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.MEM0_VERSION }}-${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.MEM0_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Mem0 ${{ env.MEM0_VERSION }} (${{ matrix.name }}) for Railway
            org.opencontainers.image.licenses=Apache-2.0
